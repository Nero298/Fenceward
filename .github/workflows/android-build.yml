name: Android Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  GODOT_VERSION: "4.4.1"
  EXPORT_NAME: "fenceward"

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Godot export templates
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Download and install Godot headless + export templates
        run: |
          set -e
          GODOT_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          TEMPLATES_URL="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"

          curl -L -o godot.zip "$GODOT_URL"
          unzip -q godot.zip -d godot_bin
          sudo mv godot_bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates
          curl -L -o templates.tpz "$TEMPLATES_URL"
          unzip -q templates.tpz -d /tmp/godot_templates
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mv /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Export ANDROID_HOME to env
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Decode keystore
        run: |
          mkdir -p /home/runner/keystores
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /home/runner/keystores/release.keystore

      - name: Configure Godot Android export credentials
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << EOF
          [gd_resource type="Resource" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/debug_keystore = "/home/runner/keystores/release.keystore"
          export/android/debug_keystore_user = "${{ secrets.ANDROID_KEY_ALIAS }}"
          export/android/debug_keystore_pass = "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
          EOF

      - name: Inject release keystore into export preset
        run: |
          sed -i "s|keystore/release=\"\"|keystore/release=\"/home/runner/keystores/release.keystore\"|" export_presets.cfg
          sed -i "s|keystore/release_user=\"\"|keystore/release_user=\"${{ secrets.ANDROID_KEY_ALIAS }}\"|" export_presets.cfg
          sed -i "s|keystore/release_password=\"\"|keystore/release_password=\"${{ secrets.ANDROID_KEYSTORE_PASSWORD }}\"|" export_presets.cfg

      - name: Import project resources
        run: timeout 120 godot --headless --import --quit-after 1 < /dev/null || echo "import step finished or timed out, continuing"

      - name: Install Android Gradle build template
        run: timeout 300 godot --headless --install-android-build-template < /dev/null

      - name: Verify Android build template was installed
        run: |
          if [ -d "android/build" ]; then
            echo "android/build exists, contents:"
            find android/build -maxdepth 2
          else
            echo "ERROR: android/build was not created — template install failed"
            exit 1
          fi

      - name: Export release AAB
        run: |
          mkdir -p build/android
          timeout 300 godot --headless --export-release "Android" build/android/${EXPORT_NAME}.aab < /dev/null

      - name: Export debug APK (for sideloading/testing)
        run: |
          timeout 300 godot --headless --export-debug "Android" build/android/${EXPORT_NAME}-debug.apk < /dev/null

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fenceward-android-build
          path: |
            build/android/${{ env.EXPORT_NAME }}.aab
            build/android/${{ env.EXPORT_NAME }}-debug.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/android/${{ env.EXPORT_NAME }}.aab
            build/android/${{ env.EXPORT_NAME }}-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
